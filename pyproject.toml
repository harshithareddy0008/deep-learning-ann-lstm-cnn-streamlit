[project]
name = "deep-learning-beginner-suite"
version = "1.0.0"
description = "Beginner-friendly end-to-end ANN, LSTM and CNN project with Streamlit and Render deployment."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pillow==10.4.0",
    "scikit-learn==1.5.2",
    "streamlit==1.39.0",
    "torch==2.5.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
